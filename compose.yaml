services:
  notes:
    image: notes
    build:
      context: .
      dockerfile: notes/Dockerfile

  keycloak-db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set in .env}
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    restart: unless-stopped
    # start-dev is for local development only (plain HTTP, relaxed hostname checks).
    command: ["start-dev", "--import-realm"]
    depends_on:
      keycloak-db:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set in .env}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:?set in .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set in .env}
      # Substituted into ${NOTES_CLIENT_SECRET} in the realm file on import
      NOTES_CLIENT_SECRET: ${NOTES_CLIENT_SECRET:?set in .env}
    volumes:
      - ./keycloak/notes-realm.json:/opt/keycloak/data/import/notes-realm.json:ro
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  keycloak-db-data:
